# Automated health monitoring (2026-07-03).
# Why a GitHub Action: scheduled Claude routines don't surface output to Jonathan;
# a GitHub issue does — GitHub emails him on creation. The status file gives a
# glanceable history in the repo. See docs/OPERATIONS.md → "Monthly hygiene".
#
# Checks:
#   1. Site is up (homepage returns 200)
#   2. Generations stuck in_progress for > 2 hours
#   3. Packages in needs_review (last 7 days, held >=10 min — see check 3 below
#      for why the grace period exists) — the sweep flagged a problem
#   4. Paid packages missing evidence-card images (ADR-0016 detector)
#   5. Character identity contamination — ≥2 characters claiming the same
#      kinship to the victim (ADR-0041 detector, Bollinger incident)
#   6-9. Content-quality detectors (ADR-0042): meta-text/CoT leak, wrong victim,
#      slip-culprit leak, self-directed questions
#   10. Completed-but-empty packages — marked completed/has_complete_package but
#      0 characters or empty overview (ADR-0043, "Victorian mansion" incident).
#      This is the check that would have caught a silent empty package with no one
#      watching — checks 1-9 all missed it because it was marked *completed*.
#   11. Structural defects (ADR-0048, "Velvet Viper" incident): invalid
#      character_role (e.g. a raw 502 body stored as the role), >1 murderer in a
#      predetermined game, a character whose background names a different person,
#      or a gender-duplicated cast. ESCALATE-ONLY — none of these are auto-fixable
#      by the ADR-0047 remediation worker; only regeneration resolves them.
#   12. Roster-count mismatches (ADR-0064, follow-up to ADR-0063 "optional
#      characters silently dropped" incident): re-parses each paid completed
#      package's approved concept snapshot with the SHIPPED extractor
#      (scripts/detect-roster-mismatches.mjs) and compares to the actual
#      mystery_characters count — catches this bug class even if a future
#      prompt/parser change reintroduces a variant of it. ESCALATE-ONLY.
#   13. Final-statement confession leak (ADR-0067 follow-up): character-style
#      packages where final_guilty/final_accomplice (meant to be a denial for
#      the Final Statements round) reads as a first-person confession instead
#      — confirmed live even with the corrected prompt, model-adherence isn't
#      guaranteed. Scoped to packages with reveal_confession_guilty/accomplice
#      populated, so pre-ADR-0067 packages (confession-in-final-statement by
#      original design, not by bug) never false-positive. ESCALATE-ONLY.
#   14. Unconfessed detective-style culprit (ADR-0070 detector): the sibling
#      failure mode to check 13, in the other mystery format. Detective-style
#      has no separate Reveal round — Final Statements IS the reveal — so a
#      murderer whose final_statement denies instead of confessing, or an
#      accomplice who denies a role the murderer already named them for,
#      means the package ships with no scripted solution at all. Heuristic,
#      documented false-positive rate (see the detector migration). Excludes
#      is_test packages. ESCALATE-ONLY.
#   15. Truncated concept messages (ADR-0103 Addendum 37, "Terminus 13"
#      incident): a customer's approved concept message can state a roster
#      total in its own header ("Character List (28 players)") while the
#      body below it only lists a fraction that many names — the reply got
#      cut off mid-list by mystery-ai's max_tokens ceiling before the
#      customer approved and purchased. Root cause is fixed at the source
#      (mystery-ai now retries once on stop_reason: 'max_tokens'); this is
#      the backstop for messages already in the database from before that
#      fix, and for the rare reply that still truncates after the one
#      bounded retry. Only fires when the ACTUAL delivered character count
#      is also meaningfully short of the header's stated count — see
#      scripts/detect-truncated-concept-messages.mjs's header comment for why
#      a stated-count mismatch alone isn't enough (the "Velvet Viper" stale-
#      snapshot false positive it was built to exclude). ESCALATE-ONLY: like
#      check 12, a mismatch means the delivered cast doesn't match what the
#      customer approved — not something to guess-fix automatically.
#
# On failure: opens (or comments on) a GitHub issue labelled `health-alert`.
# Always: writes monitoring/health-status.md and commits it if changed.

name: Health check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (for check 12, roster-mismatch detector)
        run: npm ci

      - name: Run checks
        id: checks
        run: |
          set -u
          PROBLEMS=""
          NOW_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          TEN_MIN_AGO=$(date -u -d '10 minutes ago' +"%Y-%m-%dT%H:%M:%SZ")
          TWO_H_AGO=$(date -u -d '2 hours ago' +"%Y-%m-%dT%H:%M:%SZ")
          SEVEN_D_AGO=$(date -u -d '7 days ago' +"%Y-%m-%dT%H:%M:%SZ")
          THIRTY_D_AGO=$(date -u -d '30 days ago' +"%Y-%m-%dT%H:%M:%SZ")

          # Retries only curl's transient set (connection errors, 408/429/500/502/503/504) —
          # a real 401/403/404 still fails immediately, same as before. Added 2026-08-11:
          # backtesting issue #3's history found this was the single largest source of noise
          # (29 of 56 alert comments were "Could not query ... Supabase API error"), not a
          # detector bug at all — just a bare curl with no retry hitting transient API blips.
          api() {
            curl -sf --max-time 30 --retry 3 --retry-delay 5 \
              -H "apikey: ${SUPABASE_SERVICE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
              "$@"
          }

          # 1. Site up
          SITE_CODE=$(curl -s -o /dev/null --max-time 30 -w "%{http_code}" "https://www.mysterymaker.party/" || echo "000")
          if [ "$SITE_CODE" != "200" ]; then
            PROBLEMS="${PROBLEMS}- 🔴 Website check failed: homepage returned HTTP ${SITE_CODE}\n"
          fi

          # 2. Generations stuck in_progress > 2h.
          # created_at floor: 10 orphaned in_progress rows from 2025 (deleted
          # conversations) would otherwise alert forever — only recent packages
          # can be real stuck customers.
          # Promoted to an RPC (ADR-0072) so it can join conversations and
          # exclude is_test — a raw REST filter can't cleanly do that join.
          STUCK=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_stuck_in_progress_packages" \
            -H "Content-Type: application/json" -d "{\"_stuck_before\": \"${TWO_H_AGO}\", \"_created_after\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$STUCK" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not query stuck generations (Supabase API error)\n"
            STUCK_COUNT="?"
          else
            STUCK_COUNT=$(echo "$STUCK" | jq 'length')
            if [ "$STUCK_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${STUCK_COUNT} generation(s) stuck in_progress for over 2 hours: $(echo "$STUCK" | jq -r '[.[].conversation_id] | join(", ")')\n"
            fi
          fi

          # 3. needs_review packages, last 7 days, held for at least 10 minutes.
          # The closed loop (ADR-0047/0051/0061) self-heals most needs_review
          # packages within 2-5 minutes (heal_completed_packages, the held-only
          # remediation sweep) — flagging on first sight caught packages mid-repair
          # and, once, a disposable row from a live production test of the loop
          # itself (cloned, broken on purpose, deleted afterward — see CHANGELOG
          # 2026-08-02 "ADR-0051 loop proven live end-to-end"). needs_review_at
          # (ADR-0058) gives an accurate hold-duration; the 10-minute floor matches
          # the grace period MysteryView.tsx already uses before showing the
          # "finalizing" banner (NEEDS_REVIEW_SILENT_WINDOW_MS), so this only
          # alerts on packages the loop has genuinely failed to resolve.
          # Promoted to an RPC (ADR-0072) so it can join conversations and
          # exclude is_test — a raw REST filter can't cleanly do that join.
          REVIEW=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_needs_review_packages" \
            -H "Content-Type: application/json" -d "{\"_held_before\": \"${TEN_MIN_AGO}\", \"_since\": \"${SEVEN_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$REVIEW" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not query needs_review packages (Supabase API error)\n"
            REVIEW_COUNT="?"
          else
            REVIEW_COUNT=$(echo "$REVIEW" | jq 'length')
            if [ "$REVIEW_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🟠 ${REVIEW_COUNT} package(s) flagged needs_review in the last 7 days: $(echo "$REVIEW" | jq -r '[.[].conversation_id] | join(", ")')\n"
            fi
          fi

          # 4. Paid packages missing evidence images (ADR-0016 detector; service-role only since ADR-0032)
          IMG=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_missing_evidence_images" \
            -H "Content-Type: application/json" -d '{}' || echo "QUERY_FAILED")
          if [ "$IMG" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the missing-evidence-images detector (Supabase API error)\n"
            IMG_COUNT="?"
          else
            IMG_COUNT=$(echo "$IMG" | jq '[.[] | select(.is_paid)] | length')
            if [ "$IMG_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🟠 ${IMG_COUNT} paid package(s) missing evidence-card images: $(echo "$IMG" | jq -r '[.[] | select(.is_paid) | .title] | join(", ")')\n"
            fi
          fi

          # 5. Character identity contamination (ADR-0041 detector).
          # Rolling 30-day window: the backlog itself has no cutoff, but alerting
          # only on recent generations lets handled incidents age out. The
          # Bollinger package (c3a54b47…, guest feedback 2026-07-22, already
          # handled) is excluded explicitly until the window passes it.
          IDC=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_identity_conflicts" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$IDC" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the identity-conflict detector (Supabase API error)\n"
            IDC_COUNT="?"
          else
            IDC_COUNT=$(echo "$IDC" | jq '[.[] | select(.package_id != "c3a54b47-2f04-48d7-a83e-43eac0db7f52")] | length')
            if [ "$IDC_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${IDC_COUNT} package(s) with character identity contamination (multiple characters claiming the same kinship to the victim): $(echo "$IDC" | jq -r '[.[] | select(.package_id != "c3a54b47-2f04-48d7-a83e-43eac0db7f52") | "\(.title) [\(.kin_term): \(.claimants | join(" / "))]"] | join("; ")')\n"
            fi
          fi

          # 6-9. Content-quality detectors (audit 2026-07-25, migration 20260725).
          # Same 30-day rolling window as check 5 so handled/old incidents age out.
          # 6. Model chain-of-thought / template artifacts in delivered text.
          MTL=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_meta_text_leak" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$MTL" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the meta-text-leak detector (Supabase API error)\n"
            MTL_COUNT="?"
          else
            MTL_COUNT=$(echo "$MTL" | jq 'length')
            if [ "$MTL_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${MTL_COUNT} recent package(s) with model chain-of-thought or template artifacts in delivered text: $(echo "$MTL" | jq -r '[.[] | .title] | join(", ")')\n"
            fi
          fi

          # 7. Wrong victim in game_overview (foreign-victim bleed).
          VM=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_victim_mismatch" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$VM" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the victim-mismatch detector (Supabase API error)\n"
            VM_COUNT="?"
          else
            VM_COUNT=$(echo "$VM" | jq 'length')
            if [ "$VM_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${VM_COUNT} recent package(s) whose overview names a different victim than the rest of the package: $(echo "$VM" | jq -r '[.[] | "\(.title) [overview: \(.overview_victim)]"] | join("; ")')\n"
            fi
          fi

          # 8. Fixed-culprit leak in a random-slip ("character" style) game.
          SCL=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_slip_culprit_leak" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$SCL" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the slip-culprit-leak detector (Supabase API error)\n"
            SCL_COUNT="?"
          else
            SCL_COUNT=$(echo "$SCL" | jq 'length')
            if [ "$SCL_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${SCL_COUNT} recent random-slip package(s) whose static secret pre-reveals a culprit: $(echo "$SCL" | jq -r '[.[] | .title] | join(", ")')\n"
            fi
          fi

          # 9. Self-directed / victim-directed questions.
          SDQ=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_self_directed_questions" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$SDQ" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the self-directed-questions detector (Supabase API error)\n"
            SDQ_COUNT="?"
          else
            SDQ_COUNT=$(echo "$SDQ" | jq 'length')
            if [ "$SDQ_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🟠 ${SDQ_COUNT} recent package(s) where a character asks themselves questions: $(echo "$SDQ" | jq -r '[.[] | .title] | join(", ")')\n"
            fi
          fi

          # 10. Completed-but-empty packages (ADR-0043 detector).
          # The gap the "Victorian mansion - 32 Players" incident exposed: a package
          # marked completed/has_complete_package with 0 characters (or an empty
          # overview) is invisible to checks 1-9 — check 2 only sees in_progress.
          # 30-day rolling window so recovered/aged incidents drop off once fixed.
          EMPTY=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_completed_but_empty_packages" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$EMPTY" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the completed-but-empty detector (Supabase API error)\n"
            EMPTY_COUNT="?"
          else
            EMPTY_COUNT=$(echo "$EMPTY" | jq 'length')
            if [ "$EMPTY_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${EMPTY_COUNT} package(s) marked completed but missing content (0 characters or empty overview) — a delivered mystery with no cast: $(echo "$EMPTY" | jq -r '[.[] | "\(.title) [\(.reason), paid=\(.is_paid), chars=\(.character_count)]"] | join("; ")')\n"
            fi
          fi

          # 11. Structural defects (ADR-0048 detector, migration 20260801).
          # Structurally broken packages that reached `completed`: an invalid
          # character_role (the "Velvet Viper"/"Coronation" 502-stored-as-role
          # failure), two murderers in a predetermined game, a character row whose
          # own background names a different person, or a gender-duplicated cast.
          # Same 30-day rolling window as checks 5-10.
          # ESCALATE-ONLY: do NOT auto-fix. None of these are repairable in place —
          # you cannot invent the correct role, choose between two murderers, or
          # un-cross-wire a cast. Regeneration is the only remedy, so this alert
          # is deliberately outside the auto-remediation worker's fix set.
          # The Hollingsworth Estate (27a5d467…) is excluded explicitly, same as
          # the Bollinger exclusion in check 5: its customer-approved concept
          # deliberately names characters by monster archetype (Werewolf, Zombie,
          # Ghost) while `background` carries their true name underneath — verified
          # correct-not-corrupted in ADR-0118, and the detector has no way to tell
          # a real name_background_mismatch apart from this one customer's design.
          STRUCT=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_structural_defects" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$STRUCT" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the structural-defect detector (Supabase API error)\n"
            STRUCT_COUNT="?"
          else
            STRUCT_COUNT=$(echo "$STRUCT" | jq '[.[] | select(.package_id != "27a5d467-dc9f-4b10-b03a-8d0c4668e025")] | length')
            if [ "$STRUCT_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${STRUCT_COUNT} package(s) with structural defects — NOT auto-fixable, needs regeneration: $(echo "$STRUCT" | jq -r '[.[] | select(.package_id != "27a5d467-dc9f-4b10-b03a-8d0c4668e025") | "\(.title) [paid=\(.is_paid)] \(.defects | join(" | "))"] | join("; ")')\n"
            fi
          fi

          # 12. Roster-count mismatches (ADR-0064 detector, follow-up to ADR-0063).
          # Re-parses each paid completed package's approved concept snapshot with
          # the shipped extractRosterFromMessage and compares to the actual
          # mystery_characters row count. Same 30-day rolling window as checks 5-11.
          # ESCALATE-ONLY: a mismatch means the delivered cast doesn't match what
          # the customer approved — not something to guess-fix automatically.
          ROSTER=$(node scripts/detect-roster-mismatches.mjs "--since=${THIRTY_D_AGO}" --json 2>/tmp/roster-err.log || echo "QUERY_FAILED")
          if [ "$ROSTER" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the roster-mismatch detector: $(tr '\n' ' ' < /tmp/roster-err.log)\n"
            ROSTER_COUNT="?"
          else
            ROSTER_COUNT=$(echo "$ROSTER" | jq 'length')
            if [ "$ROSTER_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${ROSTER_COUNT} package(s) whose delivered character count doesn't match their approved concept snapshot: $(echo "$ROSTER" | jq -r '[.[] | "\(.title) [approved=\(.approved_roster_count), actual=\(.actual_character_count)]"] | join("; ")')\n"
            fi
          fi

          # 13. Final-statement confession leak (ADR-0067 follow-up detector).
          # Character-style packages where final_guilty/final_accomplice reads as a
          # first-person confession instead of the intended denial. Scoped (inside the
          # SQL function) to reveal_confession_guilty/accomplice IS NOT NULL, so
          # pre-ADR-0067 packages never false-positive. Same 30-day window as 5-12.
          # ESCALATE-ONLY: confirmed live that even the corrected prompt doesn't
          # guarantee adherence — not something to guess-fix automatically.
          FSCL=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_final_statement_confession_leak" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$FSCL" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the final-statement-confession-leak detector (Supabase API error)\n"
            FSCL_COUNT="?"
          else
            FSCL_COUNT=$(echo "$FSCL" | jq 'length')
            if [ "$FSCL_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${FSCL_COUNT} package(s) with a confession leaked into the Final Statements round (should be a denial): $(echo "$FSCL" | jq -r '[.[] | "\(.title) [\(.characters | join(", "))]"] | join("; ")')\n"
            fi
          fi

          # 14. Unconfessed detective-style culprit (ADR-0070 detector).
          # Sibling to check 13 for the other mystery format: detective-style has
          # no separate Reveal round, so a murderer/accomplice denial in
          # final_statement means the package's ONLY reveal moment never actually
          # reveals anything. Same 30-day rolling window as checks 5-13.
          # ESCALATE-ONLY: heuristic with a documented false-positive rate (see
          # the detector migration) — read the flagged final_statement, don't
          # auto-remediate off this count.
          UCC=$(api -X POST "${SUPABASE_URL}/rest/v1/rpc/list_packages_with_unconfessed_culprit" \
            -H "Content-Type: application/json" -d "{\"_since\": \"${THIRTY_D_AGO}\"}" || echo "QUERY_FAILED")
          if [ "$UCC" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the unconfessed-culprit detector (Supabase API error)\n"
            UCC_COUNT="?"
          else
            UCC_COUNT=$(echo "$UCC" | jq 'length')
            if [ "$UCC_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${UCC_COUNT} detective-style package(s) whose Final Statements round doesn't actually reveal the solution: $(echo "$UCC" | jq -r '[.[] | "\(.title) [\(.reason): \(.character_name)]"] | join("; ")')\n"
            fi
          fi

          # 15. Truncated concept messages (ADR-0103 Addendum 37 detector).
          # Re-parses each paid completed package's approved concept snapshot
          # with the SHIPPED extractRosterFromMessage/extractStatedRosterCount
          # (scripts/detect-truncated-concept-messages.mjs) and compares the
          # message's own stated header count against both what's parseable
          # AND what actually got delivered. Same 30-day rolling window as
          # checks 5-14. ESCALATE-ONLY.
          TRUNC=$(node scripts/detect-truncated-concept-messages.mjs "--since=${THIRTY_D_AGO}" --json 2>/tmp/trunc-err.log || echo "QUERY_FAILED")
          if [ "$TRUNC" = "QUERY_FAILED" ]; then
            PROBLEMS="${PROBLEMS}- 🟠 Could not run the truncated-concept-message detector: $(tr '\n' ' ' < /tmp/trunc-err.log)\n"
            TRUNC_COUNT="?"
          else
            TRUNC_COUNT=$(echo "$TRUNC" | jq 'length')
            if [ "$TRUNC_COUNT" -gt 0 ]; then
              PROBLEMS="${PROBLEMS}- 🔴 ${TRUNC_COUNT} package(s) whose approved concept message looks truncated, with a matching shortfall in delivered characters: $(echo "$TRUNC" | jq -r '[.[] | "\(.title) [header=\(.stated_roster_count), delivered=\(.actual_character_count)]"] | join("; ")')\n"
            fi
          fi

          # Write status file
          mkdir -p monitoring
          {
            echo "# Site health status"
            echo ""
            echo "_Last checked: ${NOW_UTC} (runs every 6 hours; see .github/workflows/health-check.yml)_"
            echo ""
            if [ -z "$PROBLEMS" ]; then
              echo "## ✅ All checks passing"
            else
              echo "## ⚠️ Problems found"
              echo ""
              printf '%b' "$PROBLEMS"
            fi
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Website (www.mysterymaker.party) | HTTP ${SITE_CODE} |"
            echo "| Generations stuck > 2h | ${STUCK_COUNT} |"
            echo "| needs_review packages (7 days) | ${REVIEW_COUNT} |"
            echo "| Paid packages missing evidence images | ${IMG_COUNT} |"
            echo "| Character identity conflicts (30 days) | ${IDC_COUNT} |"
            echo "| Meta-text / CoT artifacts (30 days) | ${MTL_COUNT} |"
            echo "| Wrong victim in overview (30 days) | ${VM_COUNT} |"
            echo "| Slip-culprit leak (30 days) | ${SCL_COUNT} |"
            echo "| Self-directed questions (30 days) | ${SDQ_COUNT} |"
            echo "| Completed-but-empty packages (30 days) | ${EMPTY_COUNT} |"
            echo "| Structural defects — escalate only (30 days) | ${STRUCT_COUNT} |"
            echo "| Roster-count mismatches — escalate only (30 days) | ${ROSTER_COUNT} |"
            echo "| Final-statement confession leaks — escalate only (30 days) | ${FSCL_COUNT} |"
            echo "| Unconfessed detective-style culprits — escalate only (30 days) | ${UCC_COUNT} |"
            echo "| Truncated concept messages — escalate only (30 days) | ${TRUNC_COUNT} |"
          } > monitoring/health-status.md

          if [ -n "$PROBLEMS" ]; then
            {
              echo "PROBLEMS<<EOF"
              printf '%b' "$PROBLEMS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit status file
        run: |
          git config user.name "health-check-bot"
          git config user.email "actions@github.com"
          git add monitoring/health-status.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(monitoring): health status $(date -u +%Y-%m-%dT%H:%M)"
            # Another workflow may have pushed meanwhile; rebase once before giving up
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Alert via GitHub issue
        if: steps.checks.outputs.PROBLEMS != ''
        run: |
          BODY=$(printf 'The scheduled health check found problems:\n\n%s\nSee monitoring/health-status.md and docs/OPERATIONS.md for triage steps.' "${{ steps.checks.outputs.PROBLEMS }}")
          EXISTING=$(gh issue list --label health-alert --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh label create health-alert --description "Automated site health alert" --color D93F0B 2>/dev/null || true
            gh issue create --title "🔴 Site health check failed $(date -u +%Y-%m-%d)" --label health-alert --body "$BODY"
          fi
